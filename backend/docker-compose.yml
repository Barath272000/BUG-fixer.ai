services:
  # network_mode: host on every service, everywhere below, is load-bearing:
  # this stack runs inside a Codespace/devcontainer that is *itself* a
  # container, and Podman's default bridge network needs netavark to write
  # network sysctls (e.g. ping_group_range) to set up a new network
  # namespace -- which fails with "Read-only file system" in this nested
  # environment (same reason container_manager.py's own containers use
  # slirp4netns instead of a bridge). Host networking creates no new netns
  # at all, so it sidesteps netavark entirely. The cost: no more
  # service-name DNS (postgres/redis), so DATABASE_URL/REDIS_URL below use
  # localhost, and `ports:` is gone since host networking already exposes
  # each service's port directly on the host -- keeping a ports: block
  # alongside network_mode: host is invalid/ignored by compose anyway.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: bugfixai
      POSTGRES_PASSWORD: bugfixai
      POSTGRES_DB: bugfixai
      PGPORT: "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--port", "6379"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      # Same nested-Podman problem hits build-time RUN steps (this is what
      # actually failed on `apt-get update` above): the transient container
      # podman build spins up for each RUN also tries to set up its own
      # network namespace to reach the internet. `network: host` for the
      # build reuses the devcontainer's own network instead of creating one.
      network: host
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bugfixai:bugfixai@localhost:5432/bugfixai
      REDIS_URL: redis://localhost:6379
      CODESPACE_NAME: ${CODESPACE_NAME:-}
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 4000"
    depends_on:
      - postgres
      - redis
    network_mode: host
    # Nested rootless Podman needs these -- same set as .devcontainer's
    # runArgs. Without them, sandbox/container_manager.py and
    # orchestrator/pipeline.py's `podman run` calls fail to create a user
    # namespace at all.
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    devices:
      - /dev/fuse
      - /dev/net/tun

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      network: host
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bugfixai:bugfixai@localhost:5432/bugfixai
      REDIS_URL: redis://localhost:6379
    depends_on:
      - postgres
      - redis
    network_mode: host
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    devices:
      - /dev/fuse
      - /dev/net/tun

volumes:
  postgres_data: