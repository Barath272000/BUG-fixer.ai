services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bugfixai
      POSTGRES_PASSWORD: bugfixai
      POSTGRES_DB: bugfixai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bugfixai:bugfixai@postgres:5432/bugfixai
      REDIS_URL: redis://redis:6379
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 4000"
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"
    volumes:
      - ./storage:/app/storage
      - ./sandbox-work:/app/sandbox-work
      - /var/run/docker.sock:/var/run/docker.sock

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bugfixai:bugfixai@postgres:5432/bugfixai
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./storage:/app/storage
      - ./sandbox-work:/app/sandbox-work
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data: