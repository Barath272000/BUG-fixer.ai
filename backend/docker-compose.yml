services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bugfixai
      POSTGRES_PASSWORD: bugfixai
      POSTGRES_DB: bugfixai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bugfixai:bugfixai@postgres:5432/bugfixai
      REDIS_URL: redis://redis:6379
      CODESPACE_NAME: ${CODESPACE_NAME:-}
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 4000"
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"
    # Nested rootless Podman needs these -- same set as .devcontainer's
    # runArgs. Without them, sandbox/container_manager.py and
    # orchestrator/pipeline.py's `podman run` calls fail to create a user
    # namespace at all.
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    devices:
      - /dev/fuse
      - /dev/net/tun

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bugfixai:bugfixai@postgres:5432/bugfixai
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    devices:
      - /dev/fuse
      - /dev/net/tun

volumes:
  postgres_data: